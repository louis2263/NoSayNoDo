const CAT_NAMES = Object.keys(BUILTINS);
let peer,myWords=[],allClients={},conns=[],conn,readyMap={},mergedAll=[];
let trapCount=0, pool=[], used=[], timer=null, cd=5;
let wakeLock=null, wakeTimer=null, noSleepVideo=null;
async function enableWakeLock(){ try{ if('wakeLock' in navigator){ if(wakeLock){ try{ await wakeLock.release(); }catch(e){} } wakeLock = await navigator.wakeLock.request('screen'); document.getElementById('wakeState').style.display='inline'; document.getElementById('wakeState2').style.display='inline'; wakeLock.addEventListener('release', ()=>{ document.getElementById('wakeState').style.display='none'; document.getElementById('wakeState2').style.display='none'; if(document.getElementById('soloGame').style.display==='flex'){ setTimeout(enableWakeLock, 3000); } }); } noSleepVideo = document.getElementById('noSleepVideo'); if(noSleepVideo){ try{ await noSleepVideo.play(); }catch(e){} } if(wakeTimer) clearInterval(wakeTimer); wakeTimer = setInterval(async ()=>{ if(document.getElementById('soloGame').style.display==='flex'){ if('wakeLock' in navigator && (!wakeLock || wakeLock.released)){ try{ wakeLock = await navigator.wakeLock.request('screen'); document.getElementById('wakeState').style.display='inline'; }catch(e){} } if(noSleepVideo && noSleepVideo.paused){ try{ await noSleepVideo.play(); }catch(e){} } } }, 25000); }catch(e){ noSleepVideo = document.getElementById('noSleepVideo'); if(noSleepVideo){ try{ await noSleepVideo.play(); document.getElementById('wakeState').textContent='● 亮屏中(影片模式)'; document.getElementById('wakeState').style.display='inline'; }catch(e2){} } } }
function disableWakeLock(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } if(wakeTimer){ clearInterval(wakeTimer); wakeTimer=null; } if(noSleepVideo){ noSleepVideo.pause(); } document.getElementById('wakeState').style.display='none'; document.getElementById('wakeState2').style.display='none'; }catch{} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && document.getElementById('soloGame').style.display==='flex'){ enableWakeLock(); } });
const $=id=>document.getElementById(id);
const parseWords=t=>t.split(/[,，\n]+/).map(s=>s.trim()).filter(Boolean);
function getSelectedBuiltinWords(prefix){ let words=[]; CAT_NAMES.forEach(cat=>{ let safe=cat.replace('/','_'); let cb=document.getElementById('cb_'+prefix+'_'+safe); if(cb && cb.checked){ words.push(...BUILTINS[cat]); } }); return words; }
function getFinalWords(textAreaId, prefix){ let custom = parseWords(document.getElementById(textAreaId).value); let builtin = getSelectedBuiltinWords(prefix); return [...new Set([...builtin,...custom])].filter(Boolean); }
function selectAllBuiltin(prefix, sel){ CAT_NAMES.forEach(cat=>{ let safe=cat.replace('/','_'); let cb=document.getElementById('cb_'+prefix+'_'+safe); if(cb) cb.checked=sel; }); updateBuiltinCount(prefix); }
function updateBuiltinCount(prefix){ let words=getSelectedBuiltinWords(prefix); let el=document.getElementById('builtinCount_'+prefix); if(el) el.textContent='已選 '+words.length+' 個陷阱'; let preview=document.getElementById('builtinPreview_'+prefix); if(preview && preview.style.display!=='none'){ preview.innerHTML = words.map(w=>'<span class=tag-builtin>'+w+'</span>').join('') || '<span style=color:#666>未選</span>'; } }
function togglePreview_A(){ let el=document.getElementById('builtinPreview_A'); if(!el) return; el.style.display=el.style.display==='none'?'block':'none'; if(el.style.display==='block'){ let words=getSelectedBuiltinWords('A'); el.innerHTML=words.map(w=>'<span class=tag-builtin>'+w+'</span>').join('') || '<span style=color:#666>未選</span>'; } }
function togglePreview_B(){ let el=document.getElementById('builtinPreview_B'); if(!el) return; el.style.display=el.style.display==='none'?'block':'none'; if(el.style.display==='block'){ let words=getSelectedBuiltinWords('B'); el.innerHTML=words.map(w=>'<span class=tag-builtin>'+w+'</span>').join('') || '<span style=color:#666>未選</span>'; } }
const randId=()=>Math.random().toString(36).substring(2,6).toUpperCase();
function createRoom(){ $('home').style.display='none'; $('create').style.display='block'; let rid=randId(); $('myId').textContent=rid; peer=new Peer('word-v135-'+rid); peer.on('connection',c=>{ conns.push(c); c.on('open',()=>{ try{c.send({type:'hello',name:window.myName});}catch{} }); c.on('data',d=>handleHostData(d,c)); }); setInterval(()=>{ broadcastMerged(); },1200); updateBuiltinCount('A'); }
function handleHostData(d,c){ if(!d||!d.name) return; let cleanName=String(d.name).trim(); if(cleanName==='undefined'||cleanName==='') return; if(d.type==='hello'){ if(!allClients[cleanName]) allClients[cleanName]=[]; $('statusC').textContent='✅ '+cleanName+' 已加入'; broadcastMerged(); refreshReady(); } if(d.type==='words'){ allClients[cleanName]=Array.isArray(d.data)?d.data:[]; readyMap[cleanName]=true; if(myWords.length>0) readyMap[window.myName]=true; $('statusC').textContent='✅ 收到 '+cleanName+' '+allClients[cleanName].length+'個'; broadcastMerged(); refreshReady(); } }
function handleClientData(d){ if(d.type==='merged'){ mergedAll=d.merged; } if(d.type==='readyList'){ renderReadyList(d.readyMap,d.names,false); let allReady=d.names.length>=2 && d.names.every(n=>d.readyMap[n]); $('btnStartGameJ').style.display=allReady?'block':'none'; } if(d.type==='gameStart'){ mergedAll=d.merged; startSolo(); } }
function broadcastMerged(){ let all=[...myWords]; Object.keys(allClients).forEach(k=>{ if(k!=='undefined'&&Array.isArray(allClients[k])) all.push(...allClients[k]); }); let merged=[...new Set(all)].filter(Boolean); let names=[window.myName,...Object.keys(allClients).filter(k=>k!=='undefined')]; if(!merged.length&&myWords.length===0) return; mergedAll=merged; $('onlineC').textContent='在線:'+names.length+' - '+names.join(','); conns.forEach(c=>{ try{if(c.open){ c.send({type:'merged',merged,names}); c.send({type:'readyList',readyMap,names}); }}catch{} }); }
function refreshReady(){ if(myWords.length>0) readyMap[window.myName]=true; let names=[window.myName,...Object.keys(allClients).filter(k=>k!=='undefined')]; renderReadyList(readyMap,names,true); conns.forEach(c=>{ try{if(c.open) c.send({type:'readyList',readyMap,names});}catch{} }); let allReady=names.length>=2&&names.every(n=>readyMap[n]); $('btnStartGame').style.display=allReady?'block':'none'; }
function renderReadyList(map,names,isHost){ let id=isHost?'readyListC':'readyListJ'; let h=''; names.forEach(n=>{ h+='<div style=padding:6px 0><span class="dot '+(map[n]?'ok':'wait')+'"></span>'+n+' '+(map[n]?'✅ 已確認':'⏳ 等待')+'</div>'; }); h+='<div style="font-size:11px;color:#aaa;margin-top:6px">共'+names.length+'人 已齊'+Object.keys(map).filter(k=>map[k]&&k!=='undefined').length+'人</div>'; $(id).innerHTML=h; }
function startSolo(){ enableWakeLock(); pool=[...mergedAll].sort(()=>Math.random()-0.5); used=[]; trapCount=0; $('trapCount').textContent=trapCount; $('soloGame').style.display='flex'; $('trapWord').textContent='準備'; $('trapWord').style.fontSize='42px'; $('normalBtns').style.display='none'; $('countdownBox').style.display='block'; $('countTip').textContent='準備開始...'; cd=5; $('cdNum').textContent=cd; clearInterval(timer); timer=setInterval(()=>{ cd--; $('cdNum').textContent=cd; if(cd<=0){ clearInterval(timer); $('trapWord').style.fontSize='58px'; drawWord(); } },1000); conns.forEach(c=>{ try{if(c.open) c.send({type:'gameStart',merged:mergedAll});}catch{} }); }
function drawWord(){ clearInterval(timer); $('normalBtns').style.display='flex'; $('countdownBox').style.display='none'; if(pool.length===0){ pool=[...used].sort(()=>Math.random()-0.5); used=[]; } let w=pool.shift(); used.push(w); $('trapWord').textContent=w; }
function onTrapped(){ trapCount++; $('trapCount').textContent=trapCount; startCountdown(); }
function onSkip(){ startCountdown(); }
function startCountdown(){ cd=5; $('normalBtns').style.display='none'; $('countdownBox').style.display='block'; $('countTip').textContent='5秒後換新詞...'; $('cdNum').textContent=cd; clearInterval(timer); timer=setInterval(()=>{ cd--; $('cdNum').textContent=cd; if(cd<=0){ clearInterval(timer); drawWord(); } },1000); }
document.addEventListener('DOMContentLoaded',()=>{
 var bC=document.getElementById('btnCreate'); if(bC) bC.addEventListener('click',createRoom);
 var bJS=document.getElementById('btnJoinShow'); if(bJS) bJS.addEventListener('click',()=>{ $('home').style.display='none'; $('join').style.display='block'; updateBuiltinCount('B'); });
 var bJ=document.getElementById('btnJoin'); if(bJ) bJ.addEventListener('click',()=>{ let rid=$('roomId').value.trim().toUpperCase(); if(!rid) return alert('房號'); if(peer) try{peer.destroy()}catch{} peer=new Peer(); peer.on('open',()=>{ conn=peer.connect('word-v135-'+rid); conn.on('open',()=>{ conn.send({type:'hello',name:window.myName}); $('statusJ').textContent='已連線'; $('btnSendB').style.display='block'; }); conn.on('data',d=>handleClientData(d)); }); });
 var bSH=document.getElementById('btnSendHost'); if(bSH) bSH.addEventListener('click',()=>{ myWords=getFinalWords('wordsA','A'); broadcastMerged(); refreshReady(); });
 var bSB=document.getElementById('btnSendB'); if(bSB) bSB.addEventListener('click',()=>{ myWords=getFinalWords('wordsB','B'); if(conn&&conn.open){ conn.send({type:'words',name:window.myName,data:myWords}); } $('statusJ').textContent='已發送 '+myWords.length; });
 var bSG=document.getElementById('btnStartGame'); if(bSG) bSG.addEventListener('click',startSolo);
 var bSGJ=document.getElementById('btnStartGameJ'); if(bSGJ) bSGJ.addEventListener('click',startSolo);
 var bL1=document.getElementById('btnLeave1'); if(bL1) bL1.addEventListener('click',()=>location.reload());
 var bL2=document.getElementById('btnLeave2'); if(bL2) bL2.addEventListener('click',()=>location.reload());
 var bT=document.getElementById('btnTrapped'); if(bT) bT.addEventListener('click',onTrapped);
 var bS=document.getElementById('btnSkip'); if(bS) bS.addEventListener('click',onSkip);
 var bE=document.getElementById('btnExitSolo'); if(bE) bE.addEventListener('click',()=>{ clearInterval(timer); $('soloGame').style.display='none'; disableWakeLock(); });
 setTimeout(()=>{ updateBuiltinCount('A'); updateBuiltinCount('B'); },800);
});
</script></body></html>
